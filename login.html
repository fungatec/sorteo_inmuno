<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#053043">
  <title>Acceso · Sorteo Inmunobiología</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <svg class="marca" viewBox="0 0 64 64" aria-hidden="true">
      <g stroke="#053043" stroke-width="2.2" stroke-linecap="round" fill="#053043">
        <g transform="rotate(0 32 32)"><path d="M32 15V9" fill="none"/><circle cx="32" cy="6.8" r="2.6" stroke="none"/></g>
        <g transform="rotate(72 32 32)"><path d="M32 15V9" fill="none"/><circle cx="32" cy="6.8" r="2.6" stroke="none"/></g>
        <g transform="rotate(144 32 32)"><path d="M32 15V9" fill="none"/><circle cx="32" cy="6.8" r="2.6" stroke="none"/></g>
        <g transform="rotate(216 32 32)"><path d="M32 15V9" fill="none"/><circle cx="32" cy="6.8" r="2.6" stroke="none"/></g>
        <g transform="rotate(288 32 32)"><path d="M32 15V9" fill="none"/><circle cx="32" cy="6.8" r="2.6" stroke="none"/></g>
      </g>
      <circle cx="32" cy="32" r="17" fill="#A7F0F3" stroke="#053043" stroke-width="2.5"/>
      <circle cx="32" cy="32" r="12.5" fill="#43398a"/>
    </svg>
    <h1>Acceso de administración</h1>
    <p class="lead">Solo para la maestra y la persona que organiza el sorteo.</p>
    <div id="aviso" class="aviso" hidden></div>
    <form id="login" class="formulario" novalidate>
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <button type="submit" id="entrar">Entrar</button>
    </form>
    <p class="pie"><a href="index.html">Volver al registro</a></p>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
